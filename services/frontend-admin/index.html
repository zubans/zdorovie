<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления врача — Больше чем здоровье</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent);
        }
        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        h1, h2 {
            margin-top: 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .stat-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            background: rgba(255,255,255,0.02);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--card-bg);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Панель врача / CRM</div>
        <div>
            <span style="color: var(--accent); font-weight: 600;">Кабинет доктора</span>
        </div>
    </header>
    <main>
        <div class="card">
            <h1>Управление платформой и консультациями</h1>
            <p style="color: var(--text-muted);">Учёт заявок, оплат, персональных консультаций и проверка саммари встреч.</p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div style="color: var(--text-muted);">Активные клиентки</div>
                    <div class="stat-value">0</div>
                </div>
                <div class="stat-item">
                    <div style="color: var(--text-muted);">Оплаченные заказы</div>
                    <div class="stat-value">0</div>
                </div>
                <div class="stat-item">
                    <div style="color: var(--text-muted);">Консультации к проверке</div>
                    <div class="stat-value">0</div>
                </div>
                <div class="stat-item">
                    <div style="color: var(--text-muted);">Задач водяных знаков</div>
                    <div class="stat-value">0</div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© Больше чем здоровье. Панель управления.</p>
    </footer>
</body>
</html>
